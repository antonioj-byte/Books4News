{% extends "base.html" %}
{% block cuerpo %}
    <p class="texto">{{ texto }}</p>
    <div class="estante">
      {% for l in libros %}
      <div class="estante__libro">{% include "_cubierta.html" %}
        <div class="estante__ficha"><em>{{ l.titulo }}</em><span>{{ l.autor }}</span>{% if l.datos %}<span class="estante__datos">{{ l.datos }}</span>{% endif %}</div>
      </div>
      {% endfor %}
    </div>
{% endblock %}
