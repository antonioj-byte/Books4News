{% extends "base.html" %}
{% block cuerpo %}
    <p class="texto">{{ texto }}</p>
    <div class="estante">
      {% for l in libros %}
      <div class="estante__libro">{% include "_cubierta.html" %}
        <div class="estante__ficha"><b>{{ l.titulo }}</b><span>{{ l.autor }}{% if l.datos %} · {{ l.datos }}{% endif %}</span></div>
      </div>
      {% endfor %}
    </div>
{% endblock %}
