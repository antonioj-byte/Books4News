{% extends "base.html" %}
{% block cuerpo %}
    <p class="texto">{{ texto }}</p>
    <div class="estante">
      {% for l in libros %}
      <div class="tarjeta">{% include "_cubierta.html" %}
        <div class="tarjeta__ficha"><b>{{ l.titulo }}</b><i>{{ l.autor }}</i>{% if l.datos %}<span>{{ l.datos }}</span>{% endif %}</div>
      </div>
      {% endfor %}
    </div>
{% endblock %}
