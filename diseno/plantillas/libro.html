{% extends "base.html" %}
{% block cuerpo %}
    {% if libro %}{% with l=libro %}
    <div class="escaparate"><span class="escaparate__bloque"></span>{% include "_cubierta.html" %}
      {% if retrato %}<figure class="cara"><img src="{{ retrato.src }}" alt="" style="object-position: {{ retrato.enfoque[0] }}% {{ retrato.enfoque[1] }}%"></figure>{% endif %}
      <div class="escaparate__datos">
        {% if l.anio and l.anio < anio_hoy %}<div class="escaparate__anio">{{ l.anio }}</div>{% endif %}
        <div class="escaparate__titulo">{{ l.titulo }}</div>
        <div class="escaparate__autor">{{ l.autor }}</div>
      </div>
    </div>
    {% endwith %}{% endif %}
    <p class="texto{% if not libro %} texto--solo{% endif %}">{{ texto }}</p>
{% endblock %}
