{% extends "base.html" %}
{% block cuerpo %}
    {% if libro %}{% with l=libro %}
    <div class="escaparate">{% include "_cubierta.html" %}
      <div class="escaparate__datos">
        {% if l.anio and l.anio < anio_hoy %}<div class="cronologia"><span>{{ l.anio }}</span><i></i><span>{{ anio_hoy }}</span></div>{% endif %}
        <div class="escaparate__titulo"><em>{{ l.titulo }}</em></div><div class="escaparate__autor">{{ l.autor }}</div>
      </div>
    </div>
    {% endwith %}{% endif %}
    <p class="texto">{{ texto }}</p>
{% endblock %}
