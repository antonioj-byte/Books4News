# Design system de Folio: Wired + marca Alighieria (31/10).
# De Wired: imagen a sangre en blanco y negro con grano, titular grande y apretado, antetítulo de
# tema, composiciones de portada. De Alighieria (brandbook v2): los cuatro materiales del oficio
# (papel, tinta, la pluma roja del corrector y el marcador fluorescente), Alexandria 600 con un
# remate en EB Garamond cursiva, Open Sans para el texto, borde de papel rasgado entre claro y
# oscuro, tarjetas de papel rosado, muro de vocabulario del oficio. Reglas de la marca: nunca negro
# puro; fotografía solo en blanco y negro; el marcador nunca de fondo de bloque; un remate por
# titular; por diapositiva, como mucho un acento amarillo y uno rojo.
# Sin cabecera, logotipo, fecha, paginación ni créditos: el crédito va en el pie de la publicación.

lienzo:
  ancho: 1080px
  alto: 1350px

# Portada en vídeo (folio render --video), elegida el 31/10: la foto se aleja despacio y el texto queda
# fijo desde el primer fotograma, para que la miniatura del feed se lea. Solo con imagen.
video:
  segundos: 6
  fps: 30
  zoom: 1.14                 # escala de la foto al empezar; acaba en 1
  desplazamiento: -1.5%      # la foto empieza un poco más arriba

colores:
  papel: "#F6F3EE"
  papel_rosa: "#F8F0EE"
  tinta: "#1C1618"
  tinta_honda: "#120E0F"
  tinta_elevada: "#2C2427"
  tinta_60: "rgba(28, 22, 24, 0.62)"
  tinta_8: "rgba(28, 22, 24, 0.08)"
  papel_64: "rgba(246, 243, 238, 0.64)"
  pluma: "#D40549"
  marcador: "#FFF500"
  cian: "#3FE0FF"            # solo en la interferencia de la portada en vídeo (M10)

fuentes:
  archivo: fuentes/fuentes.css
  titular: "'Alexandria', 'Helvetica Neue', Arial, sans-serif"
  remate: "'EB Garamond', Garamond, Georgia, serif"
  texto: "'Open Sans', system-ui, sans-serif"
  maquina: "'IBM Plex Mono', ui-monospace, Menlo, monospace"   # el texto del teletipo

tamanos:
  titular: 112px
  cuerpo: 48px
  cuerpo_minimo: 32px
  idea: 84px
  cifra: 260px
  antetitulo: 22px
  dato: 24px

margenes:
  lateral: 80px
  superior: 80px
  inferior: 84px
  radio: 12px

# El color ya no cambia por pieza (la marca tiene una paleta cerrada); se deja la clave para el render.
campos_portada:
  reflexivo: {fondo: "#D40549", color: "#FFF500"}
  sereno: {fondo: "#D40549", color: "#FFF500"}
  ironico: {fondo: "#D40549", color: "#FFF500"}
  luminoso: {fondo: "#D40549", color: "#FFF500"}
  grave: {fondo: "#1C1618", color: "#F6F3EE"}

# Muro de vocabulario (portada sin imagen): términos del oficio, como textura
vocabulario: "galeradas · colofón · raccord · isbn · fe de erratas · regalías · tirada · pliego · sangría · viuda · huérfana · cícero · lomo · solapa · capitular · epígrafe · maqueta · prólogo · errata · imprenta · derechos · cubierta · índice · colección · reseña · traducción · edición · librería · lector · página"

rotulos:
  portada: ""
  actualidad: ""
  libro: ""
  idea: ""
  cierre: ""

logotipo: ""
