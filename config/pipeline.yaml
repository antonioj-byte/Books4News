modelos:
  ingesta: claude-haiku-5-5     # resumen y clasificación de historias
  seleccion: claude-opus-5-5    # jefe de cultura
  guion: claude-opus-5-5        # guionista
  comprobacion: claude-haiku-5-5  # comprobación de hechos del guion contra las fuentes
  arte: claude-haiku-5-5          # director de arte: tono, búsqueda y elección de la imagen
  ilustracion: claude-opus-5-5    # ilustrador: ilustración vectorial de portada (prototipo)
  chat: claude-opus-5-5           # chat de edición de la web

dev:                            # folio run --dev: todas las etapas con este modelo y esfuerzo bajo
  modelo: claude-haiku-5-5

esfuerzo:                       # output_config.effort
  ingesta: low
  seleccion: high
  guion: high
  comprobacion: medium
  arte: medium
  ilustracion: medium
  chat: medium

# USD por millón de tokens (entrada, salida[, lectura de caché]). Solo para estimar el coste en el
# informe. La escritura en caché cuesta 1,25 × entrada; sin tercer valor, la lectura es el 10 % de la entrada.
precios:
  claude-haiku-5-5: [0.10, 0.50]
  claude-opus-5-5: [4.00, 20.00, 0.20]
  claude-sonnet-5-5: [2.00, 10.00, 0.20]
  claude-opus-5: [5.00, 25.00]
  claude-opus-4-8: [5.00, 25.00]

ingesta:
  ventana_horas: 36             # se descartan artículos más antiguos
  ventana_horas_editorial: 72   # carril editorial: los medios del libro publican menos
  timeout_s: 20
  concurrencia_llm: 6

agrupacion:
  # e5 local para la Fase 1. Al desplegar (Fase 3) valorar Voyage por el peso del modelo (2,2 GB).
  modelo_embeddings: intfloat/multilingual-e5-large
  umbral_similitud: 0.84        # coseno medio mínimo para tratar dos artículos como el mismo evento (ajustado con datos del 30/10/2026: 0.82 mezcla eventos, 0.86 parte demasiado)
  # Segunda pasada: fusiona grupos con centroides por encima de este coseno (null = desactivada).
  # Datos del 30/10/2026: 0.88 junta 469 de 640 artículos en un solo grupo; 0.94 une los 8 grupos
  # del choque de Urda (63 artículos, 10 medios) sin mezclar otros eventos; 0.95 no fusiona nada.
  umbral_fusion: 0.94
  umbral_similitud_editorial: 0.88   # carril editorial: titulares cortos en muchos idiomas; sin fusión
  min_medios: 2                 # historias con menos medios distintos no pasan al jefe

seleccion:
  historias_al_jefe: 25
  historias_editoriales: 12     # carril editorial: contexto del mundo del libro para el jefe (puede elegir una)
  elegidas: 3
  reserva: 2
  antiguedad_libros: 2          # novedad: libros publicados en los últimos 2 años (primera edición o edición española)

exclusion:
  dias_historias: 7
  dias_libros: 60
  umbral_historia_repetida: 0.90  # coseno entre centroides

# Qué artículos del grupo lee el guionista: puntuación = media de la similitud con el centro del
# grupo y con «de qué se habla» (el hecho principal según el jefe), más un extra por acceso.
seleccion_textos:
  min_textos: 3
  margen: 0.06                  # se descartan los que quedan a más de esto del mejor (si quedan ≥ min_textos)
  bonus_acceso: {abierto: 0.02, parcial: 0.01, muro: 0.0}

guion:
  max_textos: 5                 # textos de la historia que recibe el guionista
  max_caracteres_texto: 6000
  reintentos: 1
  diapositivas_por_defecto: 5     # más exigen una línea de justificación por diapositiva extra
  palabras_max_diapositiva: 40    # tope duro; el prompt pide 25–30
  palabras_max_portada: 12
  palabras_max_subtitulo: 22      # subtítulo de la portada, que trae el libro o al autor
  max_citas: 1                    # citas literales del libro: solo si aparecen letra por letra en su texto (Google Books)
  palabras_cita: [4, 30]
  max_diapositivas_actualidad: 1   # la portada ya abre con la noticia
  posicion_max_primer_libro: 3     # el libro entra en la diapositiva 2 o 3
  pie_min_palabras: 80
  pie_max_palabras: 150

# Prueba A/B del guionista (folio ab / folio ab-resultados). El control es el de producción y se
# reutiliza su guion; las demás variantes reescriben con los mismos libros y textos.
arte:
  # Composiciones de portada que puede elegir el director de arte. Las del design system «Wired»:
  # sangre, banda, caja, neon. Las de la propuesta humanista: circulo, collage, ilustracion (el SVG
  # del ilustrador está desactivado: el modelo dibuja clip-art, 31/10).
  portadas: [sangre, banda, caja, neon]
  retratos: true               # retrato del autor (Wikidata + Commons) en la portada y junto a la cubierta
  retratos_cc_by_sa: true      # aceptar retratos CC BY-SA (casi todos): la diapositiva se publica con esa licencia
  # Retrato generado con IA a partir de la foto libre del autor (Magnific, Seedream 4.5 Edit), en un
  # estilo de la casa, alternando en el día. Prompts en prompts/retrato_generado.md; prueba y criterios
  # en docs/estilo-retratos.md. Necesita MAGNIFIC_API_KEY; con --dev no se genera. A mano, para una
  # pieza: folio retrato generar <pieza> --estilo voxel.
  retrato_generado:
    activo: true               # activado el 31/10 a petición del usuario
    estilos: [low_poly, voxel, render_2000]   # los tres en 3D; dithering, disponible a mano
    max_por_dia: 3             # tope de retratos generados por día (una pieza, uno)

ab:
  control: opus-high
  reutilizar_control: true
  variantes:
    opus-high: {modelo: claude-opus-5-5, esfuerzo: high}
    sonnet-high: {modelo: claude-sonnet-5-5, esfuerzo: high}
    opus-medium: {modelo: claude-opus-5-5, esfuerzo: medium}
