  propuesta: "La ficha de la pieza permite subir la foto de la persona con su crédito; va como retrato al momento y el arte no la sustituye al escribir la pieza."
  evidencia: ["Conversación, 3/11: pieza de Josefina Licitra sin foto de la autora"]

- clave: web-mas-simple
  fecha: "2026-11-03"
  destino: codigo
  patron: "«Tengo la sensación de que se está volviendo demasiado compleja la web. ¿Se te ocurre darle una pensada y simplificar el proceso?» → «Ordena pantallas y llévalo todo al chat.»"
  propuesta: "Un solo sitio para pedir cambios en una pieza (el chat, con adjuntos y comentarios por diapositiva), un botón por momento y un menú de tres. Lo nuevo entra en el chat, no como un formulario más."
  evidencia: ["Conversación, 3/11: Artifact «Folio más simple», niveles A y B"]

- clave: tema-solo-la-noticia
  fecha: "2026-11-03"
  destino: jefe_cultura
  patron: "«Le he pedido que me cuente una noticia y su enfoque ha sido proponerme una lectura lateral a partir de otro libro. Si lo que le pido es que me cuente una noticia sin tener que tener una idea original, no me haga un ensayo a propósito.»"
  propuesta: "Si la redacción pide contar una noticia (o marca «Solo la noticia»), la pieza es «Noticia»: lo que ha pasado con su contexto, sin ensayo ni lectura lateral, y sin libro salvo el libro del que trata la noticia."
  evidencia: ["Conversación, 3/11: tema del detector de IA de Gallimard convertido en lectura lateral con un libro de Villoro"]

- clave: folio-como-agencia
  fecha: "2026-11-03"
  destino: codigo
  patron: "«Esto no deja de ser una idea de SaaS que tiene que sustituir a una agencia: una serie de roles que entrenamos recursivamente con el feedback, y cada cuenta tiene una memoria. Una vertical y una horizontal.» → «Adelante con todo.»"
  propuesta: "La web enseña la agencia: menú lateral con la cuenta, Archivo con la nevera y la vigencia, Equipo con cada rol, Marca con la memoria de marca, créditos en cada pieza y «Para» en el chat. Cada regla de la memoria tiene capa: oficio, marca o celda."
  evidencia: ["Conversación, 3/11: Artifacts «La agencia de Folio» y «Mesa de edición por dentro»"]

- clave: replica-aporta-datos
  fecha: "2026-11-03"
  destino: jefe_cultura
  capa: oficio
  patron: "«Aquí hemos entrado en un bucle raro»: la redacción contestaba al jefe con datos y fuentes y el jefe volvía a proponer lo mismo con las mismas salvedades."
  propuesta: "Lo que la redacción aporta en una réplica (datos, enlaces) es material de la pieza: no se vuelve a pedir. Si la réplica solo confirma o aporta, se contesta en una frase y se da la pieza por lista para escribir."
  evidencia: ["Conversación, 3/11: tema del Goncourt con réplicas que repetían la misma propuesta"]

- clave: tema-ensayo-sin-percha
  fecha: "2026-11-03"
  destino: jefe_cultura
  capa: marca
  patron: "«Le he pedido un ensayo sin percha de temática literaria pero no sabe hacerlo» (un encargo sobre el Goncourt y el Renaudot con estructura en cinco partes, tono y fuentes)."
  propuesta: "Si la redacción pide un ensayo sobre un tema literario sin noticia ni libro (o marca «Ensayo sin percha»), la pieza es «Ensayo»: su historia y su contexto, con la estructura y el tono del encargo, que llega tal cual al guionista. Lo que las fuentes no traen no se supone."
  evidencia: ["Conversación, 3/11: encargo del Goncourt y el Renaudot"]

- clave: ilustracion-estilo-delante
  fecha: "2026-11-03"
  destino: director_arte
  capa: marca
  patron: "«Tenemos un bonito estilo de ilustración, pero está haciendo cosas muy feas. ¿Por qué no respeta las ilustraciones que venimos haciendo?» (una banda realista de época con «luz cálida»)."
  propuesta: "Las escenas que se piden a la ilustración son metáforas con objetos y figuras recortadas, sin técnica, luz ni acabado: el estilo de la casa (collage) lo pone el código, y va delante de la escena."
