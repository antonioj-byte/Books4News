- clave: fotos-de-prensa-de-la-redaccion
  fecha: "2026-11-03"
  destino: director_arte
  capa: oficio
  patron: "«Le estoy pasando fotos de prensa que se pueden usar y se niega. Arregla para que sea fácil.»"
  propuesta: "Las fotos que sube quien edita se ponen donde diga (portada, retrato, noticia, cubierta; dos en la noticia, en díptico) con el crédito que dé en la conversación, sin pedir fotógrafo ni licencia: la redacción responde de los derechos."
  evidencia: ["Conversación, 3/11: fotos de Jaenada y Désérable para la diapositiva 2"]
