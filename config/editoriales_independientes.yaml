# Editoriales independientes cuyo catálogo se lee para el formato «recomendado» (1/11, a petición del usuario:
# «busca en editoriales independientes de prestigio: las que van a Back to the Book, las que tienen caseta en la
# Feria del Libro de Madrid… mira en sus catálogos y selecciona cosas»).
#
# Las de «Back to the Book 2026» salen de su lista oficial (backtothebook.es/editoriales-2026). `referencia: true` marca las 75
# editoriales de referencia que aprobó el usuario el 2/11 (algunas ya estaban en el Back to the Book): en los candidatos de
# cada día se intercalan con las demás. Las novedades se leen en todostuslibros.com (el portal de
# las librerías de CEGAL), que tiene una página por editorial: `todostuslibros` es su ruta («impedimenta_79803»);
# si falta, se busca una vez desde el nombre y se guarda en la caché. `excluir` deja fuera la editorial (infantil).
# `pais` marca las latinoamericanas (2/11, a petición del usuario): Argentina y México, como referencia (prioridad);
# Chile y Colombia, con las demás. Solo las que están en todostuslibros (las que se distribuyen en España).
