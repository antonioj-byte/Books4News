[project]
name = "alighieria-videos"
version = "0.1.0"
description = "Alighieria · vídeos conceptuales a partir de un libro (beta)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "pillow>=10.4",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "fonttools>=4.68.0",
  "brotli>=1.2.1",
]

[project.scripts]
videos = "videos.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
